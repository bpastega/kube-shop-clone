on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: frontend, dockerfile: apps/frontend/Dockerfile }
          - { service: api,      dockerfile: apps/backend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .                         # raiz, como no compose.yaml
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kubeshop-${{ matrix.service }}:${{ github.sha }}
  trigger-deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Disparar o deploy no repositório de infraestrutura
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml -R bpastega/kubeshop-pastega \
            -f environment=dev -f app_tag="$GITHUB_SHA" -f update_os=false
